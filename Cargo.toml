[package]
name = "mpr2mpt"
version = "0.1.0"
default-run = "mpr2mpt"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
openreadout-core = "=0.4.0"
openreadout-echem = "=0.4.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rayon = "=1.12.0"
tempfile = "3.27.0"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["fs"] }
